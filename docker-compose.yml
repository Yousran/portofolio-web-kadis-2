services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/xxx_init/db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: mysql://admin:admin_password@db:3306/portfolio
      PORT: 3000
      NODE_ENV: production
    ports:
      - "80:3000"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
